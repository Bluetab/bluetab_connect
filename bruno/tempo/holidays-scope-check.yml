info:
  name: holidays-scope-check
  type: http
  seq: 4

http:
  method: GET
  url: "{{tempo_url}}/api/v1/labor-claims?per_page=1"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Safety check, not a feature: a key that only has the Holidays scope must be REFUSED here.

  Expected with a holidays-only key: 403 {"error":"Forbidden"}.
  If this returns 200, the key also has the Labor claims scope (or the scope gate is broken):
  create a key with only Holidays for integrations that just need holidays.
