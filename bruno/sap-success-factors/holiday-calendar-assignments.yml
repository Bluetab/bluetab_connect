info:
  name: holiday-calendar-assignments
  type: http
  seq: 15

http:
  method: GET
  url: "{{sf_url}}/odata/v2/HolidayCalendar('{{sf_holiday_calendar}}')/holidayAssignments"
  params:
    - name: $expand
      value: holidayNav,holidayCategoryNav,holidayClassNav
      type: query
    - name: $orderby
      value: date
      type: query
  auth: inherit

runtime:
  variables:
    - name: sf_holiday_calendar
      value: BARCELONA

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
