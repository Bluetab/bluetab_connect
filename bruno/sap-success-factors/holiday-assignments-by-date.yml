info:
  name: holiday-assignments-by-date
  type: http
  seq: 14

http:
  method: GET
  url: "{{sf_url}}/odata/v2/HolidayAssignment"
  params:
    - name: $filter
      value: HolidayCalendar_externalCode eq '{{sf_holiday_calendar}}' and date eq datetime'{{sf_holiday_date}}T00:00:00'
      type: query
    - name: $expand
      value: holidayNav,holidayCategoryNav,holidayClassNav
      type: query
  auth: inherit

runtime:
  variables:
    - name: sf_holiday_calendar
      value: BARCELONA
    - name: sf_holiday_date
      value: "2024-12-25"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
