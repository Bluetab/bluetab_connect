info:
  name: holiday-assignments
  type: http
  seq: 13

http:
  method: GET
  url: "{{sf_url}}/odata/v2/HolidayAssignment"
  params:
    - name: $filter
      value: HolidayCalendar_externalCode eq '{{sf_holiday_calendar}}'
      type: query
    - name: $expand
      value: holidayNav,holidayCategoryNav,holidayClassNav
      type: query
    - name: $orderby
      value: date
      type: query
  auth: inherit

runtime:
  variables:
    - name: sf_holiday_calendar
      value: BARCELONA

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
