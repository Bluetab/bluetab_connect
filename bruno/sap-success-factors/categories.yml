info:
  name: categories
  type: http
  seq: 3

http:
  method: GET
  url: "{{sf_url}}/odata/v2/PicklistLabel"
  params:
    - name: $filter
      value: picklistOption/picklist/picklistId eq 'ESP_CATEGORIA' and locale eq '{{sf_locale}}'
      type: query
    - name: $expand
      value: picklistOption/picklist
      type: query
    - name: $select
      value: label,optionId
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
