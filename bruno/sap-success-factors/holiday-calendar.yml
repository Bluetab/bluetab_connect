info:
  name: holiday-calendar
  type: http
  seq: 12

http:
  method: GET
  url: "{{sf_url}}/odata/v2/HolidayCalendar('{{sf_holiday_calendar}}')"
  auth: inherit

runtime:
  variables:
    - name: sf_holiday_calendar
      value: BARCELONA

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
