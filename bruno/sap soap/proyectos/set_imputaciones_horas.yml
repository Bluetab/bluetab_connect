info:
  name: set_imputaciones_horas
  type: http
  seq: 2

http:
  method: POST
  url: "{{sap_soap_url}}/{{endpoint}}"
  headers:
    - name: SOAPAction
      value: http://SCL/SCL.Addins.Bluetab.Proyectos/WebServices/SetImputacionesHoras
    - name: Content-Type
      value: text/xml;charset=utf-8
  body:
    type: xml
    data: |-
      <?xml version="1.0" encoding="UTF-8"?>
      <env:Envelope xmlns:env="http://schemas.xmlsoap.org/soap/envelope/" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
          <env:Header/>
          <env:Body>
              <SetImputacionesHoras xmlns="http://SCL/SCL.Addins.Bluetab.Proyectos/WebServices">
                  <request>
                      <AuthenticationToken>{{sap_soap_token}}</AuthenticationToken>
                      <IdEmpleado>{{id_empleado}}</IdEmpleado>
                      <Imputaciones>
                          <ImputacionHoras>
                              <Code>{{code}}</Code>
                              <IdProyecto>{{id_proyecto}}</IdProyecto>
                              <IdEmpleado>{{imputacion_id_empleado}}</IdEmpleado>
                              <Dia>{{dia}}</Dia>
                              <Horas>{{horas}}</Horas>
                              <IdTipoHora>{{id_tipo_hora}}</IdTipoHora>
                              <Comentario>{{comentario}}</Comentario>
                              <Estado>{{estado}}</Estado>
                              <Albaran>{{albaran}}</Albaran>
                              <IdEmpleadoImp>{{id_empleado_imp}}</IdEmpleadoImp>
                          </ImputacionHoras>
                      </Imputaciones>
                  </request>
              </SetImputacionesHoras>
          </env:Body>
      </env:Envelope>
  auth: inherit

runtime:
  variables:
    - name: id_empleado
      value: ""
    - name: code
      value: ""
    - name: id_proyecto
      value: ""
    - name: imputacion_id_empleado
      value: ""
    - name: dia
      value: ""
    - name: horas
      value: ""
    - name: id_tipo_hora
      value: ""
    - name: comentario
      value: ""
    - name: estado
      value: Imputado
    - name: albaran
      value: ""
    - name: id_empleado_imp
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
