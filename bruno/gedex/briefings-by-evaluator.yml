info:
  name: briefings-by-evaluator
  type: http
  seq: 3

http:
  method: GET
  url: "{{gedex_url}}/api/v1/briefings?evaluator_email={{evaluator_email}}&period_id={{period_id}}"
  params:
    - name: evaluator_email
      value: "{{evaluator_email}}"
      type: query
    - name: period_id
      value: "{{period_id}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  The briefings of the people an evaluator is responsible for in a period.

  The evaluator is the person's effective evaluator for that period and position: after a delegation, the
  original evaluator no longer matches. evaluator_id (UUID) works too.
