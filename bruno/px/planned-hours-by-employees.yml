info:
  name: planned-hours-by-employees
  type: http
  seq: 15

http:
  method: GET
  url: "{{px_url}}/api/planned-hours?employee_number=10001,10002"
  params:
    - name: employee_number
      value: 10001,10002
      type: query
    - name: doc_num
      value: "97"
      type: query
      disabled: true
    - name: months
      value: 2026-03,2026-04
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Planned hours of several employees (comma-separated list), across every project and month.

  Expected: 200 with items for both employee numbers, ordered by employee_number first.
  Enable doc_num / months to narrow it down.
