info:
  name: planned-hours-invalid-month
  type: http
  seq: 18

http:
  method: GET
  url: "{{px_url}}/api/planned-hours?months=2026-13"
  params:
    - name: months
      value: 2026-13
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Validation check, not a feature: invalid filter values must be REFUSED.

  Expected: 400. If this returns 200, the months filter is not being validated.
  Non-integer employee_number / doc_num (for example employee_number=abc) should be refused the same way.
