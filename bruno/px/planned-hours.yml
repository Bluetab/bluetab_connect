info:
  name: planned-hours
  type: http
  seq: 14

http:
  method: GET
  url: "{{px_url}}/api/planned-hours?employee_number=10001&doc_num=97&months=2026-03,2026-04"
  params:
    - name: employee_number
      value: "10001"
      type: query
    - name: doc_num
      value: "97"
      type: query
    - name: months
      value: 2026-03,2026-04
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Hours planned per employee, project and month. Requires a service account, admin, or business operations token.

  Optional query params, all of them accept one value or a list (comma-separated):
  - employee_number — SAP employee number(s)
  - doc_num — project(s), same doc_num as in the Projects API
  - months — month(s) as YYYY-MM

  Filters are combined with AND. With no filter at all the API returns every employee, project and month, so keep at least one enabled.

  Expected: 200 {"planned_hours": [{employee_number, doc_num, project_name, month, hours}], "total": n}, ordered by employee_number, doc_num and month.
