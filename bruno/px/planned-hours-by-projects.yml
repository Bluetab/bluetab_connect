info:
  name: planned-hours-by-projects
  type: http
  seq: 16

http:
  method: GET
  url: "{{px_url}}/api/planned-hours?doc_num=97,98&months=2026-03"
  params:
    - name: employee_number
      value: "10001"
      type: query
      disabled: true
    - name: doc_num
      value: 97,98
      type: query
    - name: months
      value: 2026-03
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Planned hours of several projects (comma-separated doc_num list) for one month, across every employee.

  Expected: 200 with items whose doc_num is 97 or 98 and month is 2026-03.
  doc_num is the same identifier as in the Projects API.
