info:
  name: set_aprobaciones_horas
  type: http
  seq: 4

http:
  method: POST
  url: "{{sap_soap_url}}/{{endpoint}}"
  headers:
    - name: SOAPAction
      value: http://SCL/SCL.Addins.Bluetab.Proyectos/WebServices/SetAprobacionesHoras
    - name: Content-Type
      value: text/xml;charset=utf-8
  body:
    type: xml
    data: |-
      <?xml version="1.0" encoding="UTF-8"?>
      <env:Envelope xmlns:env="http://schemas.xmlsoap.org/soap/envelope/" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
          <env:Header/>
          <env:Body>
              <SetAprobacionesHoras xmlns="http://SCL/SCL.Addins.Bluetab.Proyectos/WebServices">
                  <request>
                      <AuthenticationToken>{{soap_token}}</AuthenticationToken>
                      <Aprobaciones>
                          <ImputacionHoras>
                              <Code>{{code}}</Code>
                              <Estado>{{estado}}</Estado>
                          </ImputacionHoras>
                      </Aprobaciones>
                  </request>
              </SetAprobacionesHoras>
          </env:Body>
      </env:Envelope>
  auth: inherit

runtime:
  variables:
    - name: code
      value: ""
    - name: estado
      value: Liberado

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
