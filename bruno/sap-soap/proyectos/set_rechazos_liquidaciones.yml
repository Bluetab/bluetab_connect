info:
  name: set_rechazos_liquidaciones
  type: http
  seq: 18

http:
  method: POST
  url: "{{sap_soap_url}}/{{endpoint}}"
  headers:
    - name: SOAPAction
      value: http://SCL/SCL.Addins.Bluetab.Proyectos/WebServices/SetRechazosLiquidaciones
    - name: Content-Type
      value: text/xml;charset=utf-8
  body:
    type: xml
    data: |-
      <?xml version="1.0" encoding="UTF-8"?>
      <env:Envelope xmlns:env="http://schemas.xmlsoap.org/soap/envelope/" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
          <env:Header/>
          <env:Body>
              <SetRechazosLiquidaciones xmlns="http://SCL/SCL.Addins.Bluetab.Proyectos/WebServices">
                  <request>
                      <AuthenticationToken>{{soap_token}}</AuthenticationToken>
                      <Rechazos>
                          <DatosRechazoLiquidacion>
                              <Code>{{code}}</Code>
                              <MotivoRechazo>{{motivo_rechazo}}</MotivoRechazo>
                          </DatosRechazoLiquidacion>
                      </Rechazos>
                  </request>
              </SetRechazosLiquidaciones>
          </env:Body>
      </env:Envelope>
  auth: inherit

runtime:
  variables:
    - name: code
      value: ""
    - name: motivo_rechazo
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
