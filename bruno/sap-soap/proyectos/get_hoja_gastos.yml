info:
  name: get_hoja_gastos
  type: http
  seq: 21

http:
  method: POST
  url: "{{sap_soap_url}}/{{endpoint}}"
  headers:
    - name: SOAPAction
      value: http://SCL/SCL.Addins.Bluetab.Proyectos/WebServices/GetHojaGastos
    - name: Content-Type
      value: text/xml;charset=utf-8
  body:
    type: xml
    data: |-
      <?xml version="1.0" encoding="UTF-8"?>
      <env:Envelope xmlns:env="http://schemas.xmlsoap.org/soap/envelope/" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
          <env:Header/>
          <env:Body>
              <GetHojaGastos xmlns="http://SCL/SCL.Addins.Bluetab.Proyectos/WebServices">
                  <request>
                      <AuthenticationToken>{{soap_token}}</AuthenticationToken>
                      <UserId>{{user_id}}</UserId>
                      <FromDate>{{from_date}}</FromDate>
                      <ToDate>{{to_date}}</ToDate>
                  </request>
              </GetHojaGastos>
          </env:Body>
      </env:Envelope>
  auth: inherit

runtime:
  variables:
    - name: user_id
      value: ""
      disabled: true
    - name: from_date
      value: 2025-01-01
    - name: to_date
      value: 2026-01-01

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
