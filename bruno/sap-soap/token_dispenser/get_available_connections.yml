info:
  name: get_available_connections
  type: http
  seq: 2

http:
  method: POST
  url: "{{sap_soap_url}}/{{endpoint}}"
  headers:
    - name: SOAPAction
      value: http://SCL/WSS/TokenDispenser/WebServices/GetAvailableConnections
    - name: Content-Type
      value: text/xml;charset=utf-8
  body:
    type: xml
    data: |-
      <?xml version="1.0" encoding="UTF-8"?>
      <env:Envelope xmlns:env="http://schemas.xmlsoap.org/soap/envelope/" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
          <env:Header/>
          <env:Body>
              <GetAvailableConnections xmlns="http://SCL/WSS/TokenDispenser/WebServices">
                  <UserName>{{soap_username}}</UserName>
                  <Password>{{soap_password}}</Password>
              </GetAvailableConnections>
          </env:Body>
      </env:Envelope>
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
