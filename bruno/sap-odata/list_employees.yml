info:
  name: list_employees
  type: http
  seq: 1

http:
  method: GET
  url: "{{sap_odata_url}}/b1s/v2/EmployeesInfo?$filter=(eMail eq  'euclydes.young@bluetab.net')"
  headers:
    - name: prefer
      value: odata.maxpagesize={{odata_page_size}}
    - name: B1S-CaseInsensitive
      value: "true"
      disabled: true
  params:
    - name: $filter
      value: (eMail eq  'euclydes.young@bluetab.net')
      type: query
    - name: $select
      value: EmployeeID,eMail
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
