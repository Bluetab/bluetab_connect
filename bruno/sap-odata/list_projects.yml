info:
  name: list_projects
  type: http
  seq: 2

http:
  method: GET
  url: "{{sap_odata_url}}/b1s/v2/ProjectManagements"
  params:
    - name: $select
      value: AbsEntry,ProjectName,StartDate,ClosingDate,DocNum,BusinessPartner,BusinessPartnerName,ProjectStatus,FinancialProject,Reason
      type: query
    - name: $filter
      value: contains(Reason, 'INITIATIVE_CODE')
      type: query
      disabled: true
  headers:
    - name: prefer
      value: odata.maxpagesize={{odata_page_size}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
