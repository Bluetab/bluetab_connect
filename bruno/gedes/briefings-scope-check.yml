info:
  name: briefings-scope-check
  type: http
  seq: 6

http:
  method: GET
  url: "{{gedes_url}}/api/v1/evaluations?limit=1"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Safety check, not a feature: a key that only has the Briefings scope must be REFUSED here.

  Expected with a briefings-only key: 403 {"error":"Forbidden"}.
  If this returns 200, the key also has the Evaluations scope (or the scope gate is broken): create a key with
  only Briefings for integrations that just need briefings.
