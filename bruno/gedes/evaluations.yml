info:
  name: evaluations
  type: http
  seq: 4

http:
  method: GET
  url: "{{gedes_url}}/api/v1/evaluations?limit=5"
  params:
    - name: limit
      value: "5"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  The first published evaluations of every person and period.

  Needs a Gedes API key with the Evaluations scope (Gedes: Admin -> API keys), set as gedes_api_key.
  - 401: key unknown, revoked or expired
  - 403: key valid but without the Evaluations scope

  Response: { "items": [...], "total": n, "limit": 5, "offset": 0 }. Each item has the rating, rationale and
  feedback plus objective_ratings and competency_ratings. These are people's evaluations: do not paste responses
  into tickets or chats.
