info:
  name: careers-scope-check
  type: http
  seq: 10

http:
  method: GET
  url: "{{gedes_url}}/api/v1/briefings?limit=1"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Safety check, not a feature: a key that only has the Careers and categories scope must be REFUSED here.

  Expected with a careers-only key: 403 {"error":"Forbidden"}.
  If this returns 200, the key also has the Briefings scope (or the scope gate is broken): the catalog is not data
  about people, so an app that only needs careers should not be able to read briefings.
