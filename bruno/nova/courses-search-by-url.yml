info:
  name: courses-search-by-url
  type: http
  seq: 6

http:
  method: GET
  url: "{{nova_url}}/api/learning_objects/moocs/search?external_url=https%3A%2F%2Fexample.com%2Fbruno-check"
  params:
    - name: external_url
      value: https://example.com/bruno-check
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Has this course been added already? external_url matches the address EXACTLY (BluetabConnect.Nova.Rest.search_courses/1). Use
  it before creating a course, which is not idempotent. With q too, a course must match both.

  Set external_url to the address of the course. The example finds nothing unless someone added that address: an empty
  { "items": [], "total": 0 } is the answer for no course, not an error.

  Needs the Learning objects scope.
