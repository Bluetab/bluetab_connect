info:
  name: send-email
  type: http
  seq: 1

http:
  method: POST
  url: "{{markt_url}}/api/v1/emails"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "to": "{{recipient_email}}",
        "variables": {
          "app_name": "Bruno",
          "subtitle": "Labor claims",
          "title": "Labor claim approved",
          "message": "Your claim **#4521** was approved.\nThe payment is scheduled for Friday.\n\n- Amount: 120 EUR\n- Date: 14 November",
          "action_url": "https://tempo.app.bluetab.net/claims/4521",
          "action_label": "View claim"
        }
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "202"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Sends a notification with Markt's generic BIA template (the default). Start here to check that the key works.

  Needs a Markt API key with the Send email scope (Markt: Admin -> API keys), set as markt_api_key.
  - 401: key unknown, deleted or expired
  - 403: key valid but without the Send email scope

  Sends to recipient_email. Against prod this is a real email: set recipient_email to your own address first (it is empty in markt_prod, and the request answers 422 until you do).

  Response 202: { "data": [ { "id": "...", "to": "...", "status": "pending" } ] }. Accepted means queued, not delivered:
  Markt sends right after, in the background. Find the email by its id in Markt: Admin -> Email activity.

  BIA template variables: title and message are required; subtitle, app_name (default BIA), action_url (adds a
  button) and action_label (default Open) are optional.

  The email is a bar on top (logo, app name, subtitle), a greeting, the message and a footer. title is the subject
  only: it is not shown in the body. message is Markdown (a plain string works too, and line breaks are kept); the
  other values are plain text and are escaped.
